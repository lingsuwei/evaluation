user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 1800;
    client_max_body_size 100m;

    server {
        listen 80;
        server_name localhost;

        # 前端入口 HTML 不缓存，确保每次都能拿到最新的 index-*.js 引用
        location = / {
            root /app/frontend/dist;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
        location = /index.html {
            root /app/frontend/dist;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # MCP list_metrics 直连后端 /metrics（后端路由无 /api 前缀，
        # 不能走 location /api/ 否则被剥前缀；也不能落 location / 否则被 SPA catch-all）
        location = /metrics {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # /api/v1/* 后端路由本身带 /api 前缀（如 /api/v1/evaluate/single），
        # 必须在 location /api/ 之前用更长前缀匹配，且 proxy_pass 不带尾斜杠以保留完整路径
        location /api/v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # 其它静态资源（hash 化文件名）正常缓存
        location / {
            root /app/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API 代理到后端（禁用浏览器缓存，避免前端拿到过期数据）
        # proxy_pass 带尾斜杠会剥掉 /api 前缀，使前端 /api/metrics → 后端 /metrics
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
