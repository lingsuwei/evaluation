        <div style="text-align:center;color:#6b7280;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
          <div style="width:36px;height:36px;border:3px solid #e6e8f0;border-top-color:#1565c0;border-radius:50%;margin:0 auto 12px;animation:__pre_spin 0.8s linear infinite;"></div>

        </div>

      <style>@keyframes __pre_spin{to{transform:rotate(360deg)}}</style>

    <script type="module" src="/src/main.tsx"></script>
